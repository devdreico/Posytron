project_id = "posytron"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://posytron.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.register-tenant]
verify_jwt = false

[functions.employee-login]
verify_jwt = false

[functions.mercadopago-webhook]
verify_jwt = false

[functions.ai-chat]
verify_jwt = true
